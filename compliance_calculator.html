<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compliance Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #ffffff; /* white background */
      color: #000000;      /* black text */
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #004aad; /* deep blue accent */
      text-align: center;
    }

    .question {
      margin: 20px 0;
      padding: 15px;
      background: #f2f2f2; /* light gray card */
      border-radius: 8px;
    }

    .question p {
      margin-bottom: 10px;
      font-weight: bold;
    }

    button {
      margin: 5px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background-color: #007bff; /* blue */
      color: #ffffff;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #0056b3; /* darker blue on hover */
    }

    button.active {
      background-color: #004aad; /* highlight when clicked */
      font-weight: bold;
    }

    #results {
      margin-top: 30px;
      padding: 20px;
      background: #f2f2f2;
      border-radius: 8px;
    }

    #error {
      color: red;
      font-weight: bold;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Cybersecurity Compliance Calculator</h1>

  <div id="questions"></div>

  <div style="text-align:center;">
    <button onclick="calculate()">Calculate Compliance</button>
  </div>

  <div id="error"></div>
  <div id="results"></div>

  <script>
    const questions = [
      { text: "Do you use Multi-Factor Authentication?", key: "mfa" },
      { text: "Is sensitive data encrypted at rest and in transit?", key: "encryption" },
      { text: "Do you have a documented incident response plan?", key: "ir_plan" },
      { text: "Do you have continuous monitoring for threats?", key: "monitoring" },
      { text: "Do you regularly back up data and test recovery?", key: "backup" }
    ];

    const answers = {};

    function renderQuestions() {
      const container = document.getElementById("questions");
      questions.forEach(q => {
        const div = document.createElement("div");
        div.className = "question";
        div.innerHTML = `
          <p>${q.text}</p>
          <button id="${q.key}-yes" onclick="setAnswer('${q.key}', 'yes')">Yes</button>
          <button id="${q.key}-no" onclick="setAnswer('${q.key}', 'no')">No</button>
        `;
        container.appendChild(div);
      });
    }

    function setAnswer(key, value) {
      answers[key] = value;

      // Reset button states
      document.getElementById(`${key}-yes`).classList.remove("active");
      document.getElementById(`${key}-no`).classList.remove("active");

      // Highlight selected button
      document.getElementById(`${key}-${value}`).classList.add("active");
    }

    function calculate() {
      // Check if all questions are answered
      for (let q of questions) {
        if (!answers[q.key]) {
          document.getElementById("error").innerText = "⚠️ Please answer all questions before calculating.";
          document.getElementById("results").innerHTML = "";
          return;
        }
      }

      document.getElementById("error").innerText = ""; // clear error

      let score = 0;
      const maxScore = questions.length;

      questions.forEach(q => {
        if (answers[q.key] === "yes") score++;
      });

      const compliancePercentage = (score / maxScore) * 100;
      let resultText = `<h2>Your Cybersecurity compliance score: ${compliancePercentage}%</h2>`;

      if (compliancePercentage === 100) {
        resultText += "<p>Excellent! You are fully compliant with these core controls.</p>";
      } else {
        resultText += "<p>Areas to improve:</p><ul>";
        questions.forEach(q => {
          if (answers[q.key] !== "yes") {
            resultText += `<li>${q.text}</li>`;
          }
        });
        resultText += "</ul>";
      }

      document.getElementById("results").innerHTML = resultText;
    }

    renderQuestions();
  </script>
</body>
</html>
